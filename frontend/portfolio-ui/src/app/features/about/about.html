<section class="about-page">

  <div class="about-container">

    <!-- =========================
         ABOUT HEADER
    ========================== -->

    <div class="about-header">

      <span class="section-label">
        ABOUT <span class="accent">ME</span>
      </span>

      <h1>
        A little bit about me.
      </h1>

    </div>


    <!-- =========================
         INTRODUCTION
    ========================== -->

    <div class="about-content">

      <div class="about-card">

        <div class="about-card-line"></div>

        <p class="about-introduction">
          {{ hero?.introduction }}
        </p>

      </div>

    </div>


    <!-- =========================
         EDUCATION
    ========================== -->

    <section class="education-section">

      <div class="education-header">

        <span class="section-label">
          EDUCATION
        </span>

        <h2>
          My academic journey.
        </h2>

      </div>


      <div class="education-timeline">

        <div
          class="education-item"
          *ngFor="let item of education"
        >

          <div class="education-dot"></div>

          <div class="education-card">

            <div class="education-card-header">

              <div>
                <h3>
                  {{ item.degree }}
                </h3>

                <h4>
                  {{ item.institution }}
                </h4>
              </div>

              <span class="education-years">

                <ng-container *ngIf="item.startYear">
                  {{ item.startYear }}
                </ng-container>

                <ng-container *ngIf="item.startYear && item.endYear">
                  —
                </ng-container>

                <ng-container *ngIf="item.endYear">
                  {{ item.endYear }}
                </ng-container>

              </span>

            </div>


            <p
              class="education-field"
              *ngIf="item.fieldOfStudy"
            >
              {{ item.fieldOfStudy }}
            </p>


            <p
              class="education-location"
              *ngIf="item.location"
            >
              {{ item.location }}
            </p>


            <p
              class="education-description"
              *ngIf="item.description"
            >
              {{ item.description }}
            </p>

          </div>

        </div>

      </div>

    </section>

  </div>

</section>
